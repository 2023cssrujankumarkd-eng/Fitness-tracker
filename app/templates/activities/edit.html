{% extends "base.html" %}

{% block title %}Edit Activity - Fitness Tracker{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Edit Activity</h1>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                Update your activity details below.
            </p>
        </div>

        <!-- Edit Form -->
        <form method="POST" action="{{ url_for('activities.edit_activity', activity_id=activity.id) }}" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Activity Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Activity Name</label>
                <input type="text" name="name" id="name" value="{{ activity.name }}" required
                       class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Activity Type -->
            <div>
                <label for="type" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Activity Type</label>
                <select name="type" id="type" required
                        class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
                    <option value="Running" {% if activity.type == 'Running' %}selected{% endif %}>Running</option>
                    <option value="Walking" {% if activity.type == 'Walking' %}selected{% endif %}>Walking</option>
                    <option value="Cycling" {% if activity.type == 'Cycling' %}selected{% endif %}>Cycling</option>
                    <option value="Swimming" {% if activity.type == 'Swimming' %}selected{% endif %}>Swimming</option>
                    <option value="Weight Training" {% if activity.type == 'Weight Training' %}selected{% endif %}>Weight Training</option>
                    <option value="Yoga" {% if activity.type == 'Yoga' %}selected{% endif %}>Yoga</option>
                    <option value="Other" {% if activity.type == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <!-- Duration -->
            <div>
                <label for="duration" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Duration (minutes)</label>
                <input type="number" name="duration" id="duration" value="{{ activity.duration }}" required min="1"
                       class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Calories -->
            <div>
                <label for="calories" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Calories Burned</label>
                <input type="number" name="calories" id="calories" value="{{ activity.calories }}" required min="1"
                       class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Date and Time -->
            <div>
                <label for="date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Date and Time</label>
                <input type="datetime-local" name="date" id="date" 
                       value="{{ activity.timestamp.strftime('%Y-%m-%dT%H:%M') }}" required
                       class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Notes -->
            <div>
                <label for="notes" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Notes</label>
                <textarea name="notes" id="notes" rows="3"
                          class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">{{ activity.notes }}</textarea>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end space-x-3">
                <a href="{{ url_for('activities.activity_detail', activity_id=activity.id) }}"
                   class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                    Cancel
                </a>
                <button type="submit"
                        class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
