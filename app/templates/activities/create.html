{% extends "base.html" %}

{% block title %}Add Activity - Fitness Tracker{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Add New Activity</h1>
            <a href="{{ url_for('activities.activity_index') }}" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
                <i class="fas fa-times text-xl"></i>
            </a>
        </div>

        <form method="POST" action="{{ url_for('activities.create_activity') }}" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- Activity Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Activity Name</label>
                <input type="text" name="name" id="name" required
                    class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Activity Type -->
            <div>
                <label for="type" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Activity Type</label>
                <select name="type" id="type" required
                    class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
                    <option value="">Select a type</option>
                    <option value="Running">Running</option>
                    <option value="Cycling">Cycling</option>
                    <option value="Swimming">Swimming</option>
                    <option value="Walking">Walking</option>
                    <option value="Gym">Gym</option>
                    <option value="Yoga">Yoga</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Duration -->
            <div>
                <label for="duration" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Duration (minutes)</label>
                <input type="number" name="duration" id="duration" min="1" required
                    class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Calories -->
            <div>
                <label for="calories" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Calories Burned</label>
                <input type="number" name="calories" id="calories" min="1" required
                    class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Details -->
            <div>
                <label for="details" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Details</label>
                <textarea name="details" id="details" rows="3"
                    class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white"></textarea>
            </div>

            <!-- Date -->
            <div>
                <label for="date" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Date</label>
                <input type="datetime-local" name="date" id="date" required
                    class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-green-500 focus:ring-green-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end">
                <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg flex items-center space-x-2">
                    <i class="fas fa-plus"></i>
                    <span>Add Activity</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Set default date to current date and time
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('date').value = now.toISOString().slice(0, 16);

    // Calculate calories based on activity type and duration
    const typeSelect = document.getElementById('type');
    const durationInput = document.getElementById('duration');
    const caloriesInput = document.getElementById('calories');

    const calorieRates = {
        'Running': 10,
        'Cycling': 7,
        'Swimming': 8,
        'Walking': 4,
        'Gym': 6,
        'Yoga': 3,
        'Other': 5
    };

    function updateCalories() {
        const type = typeSelect.value;
        const duration = parseInt(durationInput.value) || 0;
        const rate = calorieRates[type] || 5;
        caloriesInput.value = Math.round(duration * rate);
    }

    typeSelect.addEventListener('change', updateCalories);
    durationInput.addEventListener('input', updateCalories);
});
</script>
{% endblock %}
